[package]
name = "core"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust.git"
description = "The Rust Core Library"
autotests = false
autobenches = false
# If you update this, be sure to update it in a bunch of other places too!
# As of 2024, it was src/tools/opt-dist, the core-no-fp-fmt-parse test and
# the version of the prelude imported in core/lib.rs.
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
safety = { path = "../contracts/safety" }

[features]
# Issue a compile error that says to use -Cpanic=immediate-abort
panic_immediate_abort = []
# Choose algorithms that are optimized for binary size instead of runtime performance
optimize_for_size = []
# Make `RefCell` store additional debugging information, which is printed out when
# a borrow error occurs
debug_refcell = []
llvm_enzyme = []

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(no_fp_fmt_parse)',
    # core use #[path] imports to portable-simd `core_simd` crate
    # and to stdarch `core_arch` crate which messes-up with Cargo list
    # of declared features, we therefor expect any feature cfg
    'cfg(feature, values(any()))',
    # Internal features aren't marked known config by default, we use these to
    # gate tests.
    'cfg(target_has_reliable_f16)',
    'cfg(target_has_reliable_f16_math)',
    'cfg(target_has_reliable_f128)',
    'cfg(target_has_reliable_f128_math)',
    'cfg(llvm_enzyme)',
    'cfg(kani)',
    'cfg(flux)',
]

[package.metadata.flux]
enabled = true
check_overflow = "lazy"
include = [
    "src/ascii*.rs",
    "src/num/mod.rs",
    "src/pat.rs",
    "src/bstr/*.rs",
    "src/hash/*.rs",
    "src/time.rs",
    "src/num/niche_types.rs",
    "src/mem/mod.rs",
    "src/unicode/*.rs",
]

include_trusted = [
    "src/alloc/layout.rs",
    "src/alloc/mod.rs",
    "src/char/methods.rs",
    "src/char/decode.rs",
    "src/clone.rs",
    "src/convert/mod.rs",
    "src/fmt/mod.rs",
    "src/iter/sources/repeat_n.rs",
    "src/iter/traits/collect.rs",
    "src/iter/traits/iterator.rs",
    "src/num/*.rs",
    "src/ops/drop.rs",
    "src/ops/function.rs",
    "src/ops/range.rs",
    "src/option.rs",
    "src/ptr/alignment.rs",
    "src/ptr/mut_ptr.rs",
    "src/ptr/non_null.rs",
    "src/ptr/unique.rs",
    "src/slice/mod.rs",
    "src/str/iter.rs",
    "src/str/mod.rs",
    "src/str/pattern.rs",
    "src/str/traits.rs",
    "src/hint.rs",
    "src/result.rs",
    "src/ptr/mod.rs",
    "src/iter/adapters/*.rs",
    "src/fmt/builders.rs",
    "src/iter/sources/repeat_with.rs",
    "src/slice/index.rs",
    "src/panicking.rs",
    "src/mem/manually_drop.rs",
    "src/str/converts.rs",
    "src/iter/sources/from_fn.rs",
    "src/slice/raw.rs",
    "src/str/error.rs",
    "src/iter/sources/once.rs",
]
